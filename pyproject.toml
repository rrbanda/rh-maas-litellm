[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rh-maas-litellm"
version = "0.1.0"
description = "Google ADK LiteLlm adapter for Red Hat MaaS (OpenAI-compatible Gemini endpoint)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["google-adk", "litellm", "red-hat", "maas", "gemini", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "google-adk>=1.31.0",
    "litellm>=1.40.0",
]

[project.urls]
Repository = "https://github.com/rrbanda/rh-maas-litellm"
"Bug Tracker" = "https://github.com/rrbanda/rh-maas-litellm/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rh_maas_litellm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
